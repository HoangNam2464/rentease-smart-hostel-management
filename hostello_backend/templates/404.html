<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - RentEase</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #172033;
            background: #f5f7fb;
        }

        .error-card {
            width: min(560px, calc(100% - 32px));
            padding: 32px;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 14px 36px rgba(23, 32, 51, 0.08);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .brand-mark {
            display: inline-flex;
            width: 36px;
            height: 36px;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            color: #ffffff;
            background: #2563eb;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 14px;
            border-radius: 8px;
            color: #ffffff;
            background: #2563eb;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="error-card">
        <div class="brand">
            <span class="brand-mark">R</span>
            <span>RentEase</span>
        </div>
        <h1>Page not found</h1>
        <p>The page may have moved, or the link may no longer be available. You can return to the RentEase home page and continue from there.</p>
        <a href="/">Back to home</a>
    </main>
</body>
</html>
